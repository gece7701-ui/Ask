<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aşk Havayolları</title>
    <style>
        body {
            margin: 0; padding: 0;
            font-family: sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #fff; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }
        .card-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 35px; border-radius: 25px;
            text-align: center; width: 85%; max-width: 420px;
        }
        h1 { font-size: 26px; color: #74b9ff; margin-bottom: 5px; }
        .subtitle { font-size: 13px; color: #dfe6e9; margin-bottom: 30px; }
        .form-group { text-align: left; margin-bottom: 25px; }
        label { display: block; font-size: 14px; color: #a29bfe; margin-bottom: 8px; }
        input, select {
            width: 100%; padding: 14px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px; color: white; font-size: 16px;
            outline: none; box-sizing: border-box;
        }
        option { background: #2a5298; color: white; }
        .btn-launch {
            background: linear-gradient(90deg, #0984e3, #00cec9);
            color: white; border: none; padding: 16px;
            width: 100%; border-radius: 12px;
            font-size: 18px; font-weight: bold; cursor: pointer;
        }
        .screen-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #0f172a; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100;
            padding: 30px; box-sizing: border-box; text-align: center;
        }
        .plane-icon { font-size: 70px; margin-bottom: 30px; }
        .story-title { font-size: 28px; color: #00cec9; margin-bottom: 15px; }
        .story-text { font-size: 18px; color: #cbd5e1; max-width: 600px; line-height: 1.8; margin-bottom: 40px; }
        .window-simulation {
            width: 100%; height: 100%; display: flex;
            justify-content: center; align-items: center;
            background-size: cover; background-position: center;
        }
        .control-panel {
            position: absolute; bottom: 40px;
            background: rgba(15, 23, 42, 0.85); padding: 20px 30px;
            border-radius: 20px; text-align: center;
        }
        .btn-back {
            background: rgba(255, 255, 255, 0.2); color: white;
            padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-top: 10px;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="step-1" class="card-container">
        <h1>AŞK HAVAYOLLARI</h1>
        <div class="subtitle">Mesafe Tanımayan Dijital Pasaport</div>
        <div class="form-group">
            <label>Özel Yolcu İsmi:</label>
            <input type="text" id="passenger" value="Sedat">
        </div>
        <div class="form-group">
            <label>Simülasyon Hedefi:</label>
            <select id="target">
                <option value="">-- Keşfetmek İstediğin Yer? --</option>
                <option value="switzerland">🇨🇭 İsviçre Alpleri (Kış Evi)</option>
                <option value="maldives">🇲🇻 Maldiv Adaları (Okyanus Bungalovu)</option>
                <option value="australia">🇦🇺 Avustralya (Doğa Macerası)</option>
            </select>
        </div>
        <button class="btn-launch" onclick="startJourney()">Uçuşu Kilitle ✈️</button>
    </div>

    <div id="step-2" class="screen-overlay hidden">
        <div class="plane-icon">✈️</div>
        <h2 class="story-title" id="story-title">Yolculuk Başlıyor...</h2>
        <p class="story-text" id="story-text">Rota hesaplanıyor...</p>
        <button class="btn-launch" style="max-width: 250px;" onclick="enterSimulation()">Odaya Giriş Yap 🗝️</button>
    </div>

    <div id="step-3" class="screen-overlay hidden" style="padding: 0;">
        <div id="sim-view" class="window-simulation">
            <div class="control-panel">
                <h3 id="panel-title" style="margin: 0; color: #00cec9;">Konum</h3>
                <p id="panel-desc" style="margin: 10px 0; font-size: 14px; color: #94a3b8;">Detay</p>
                <button class="btn-back" onclick="resetApp()">✈️ Yeni Rotaya Uç</button>
            </div>
        </div>
    </div>

    <script>
        let selectedDest = "";
        let passengerName = "";

        function startJourney() {
            passengerName = document.getElementById('passenger').value;
            selectedDest = document.getElementById('target').value;

            if (!passengerName || !selectedDest) {
                alert('Lütfen bir rota seçin! ❤️');
                return;
            }

            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('step-2').classList.remove('hidden');

            if (selectedDest === "switzerland") {
                document.getElementById('story-title').innerText = "🏔️ İsviçre Alpleri";
                document.getElementById('story-text').innerText = "Sevgili " + passengerName + ", uçağımız şu an karlı dağların üzerinde. Senin için hazırladığım dağ evinin şöminesi sıcacık yanıyor. Hazırsan kapıyı aç!";
            } else if (selectedDest === "maldives") {
                document.getElementById('story-title').innerText = "🏝️ Maldivler Turkuazı";
                document.getElementById('story-text').innerText = "Sevgili " + passengerName + ", pencerenden aşağı baktığında okyanusu görebilirsin. Bungalovumuz seni bekliyor. Hazırsan adaya adım at!";
            } else if (selectedDest === "australia") {
                document.getElementById('story-title').innerText = "🦘 Avustralya Doğası";
                document.getElementById('story-text').innerText = "Sevgili " + passengerName + ", en çok merak ettiğin o devasa kıtaya ulaştık! Doğa seni bekliyor. Hazırsan maceraya başla!";
            }
        }

        function enterSimulation() {
            document.getElementById('step-2').classList.add('hidden');
            document.getElementById('step-3').classList.remove('hidden');
            const view = document.getElementById('sim-view');
            
            if (selectedDest === "switzerland") {
                view.style.backgroundImage = "url('https://unsplash.com')";
                document.getElementById('panel-title').innerText = "🏔️ İsviçre Dağ Kulübesi";
                document.getElementById('panel-desc').innerText = "Sadece senin için parlayan Alpler.";
            } else if (selectedDest === "maldives") {
                view.style.backgroundImage = "url('https://unsplash.com')";
                document.getElementById('panel-title').innerText = "🏝️ Maldiv Sahili";
                document.getElementById('panel-desc').innerText = "Dalgaların sesi kalbinin ritmine karışıyor.";
            } else if (selectedDest === "australia") {
                view.style.backgroundImage = "url('https://unsplash.com')";
                document.getElementById('panel-title').innerText = "🇦🇺 Avustralya Vadisi";
                document.getElementById('panel-desc').innerText = "Uzaklar sadece bir sayıdan ibaret.";
            }
        }

        function resetApp() {
            document.getElementById('step-3').classList.add('hidden');
            document.getElementById('step-1').classList.remove('hidden');
        }
    </script>
</body>
</html>
