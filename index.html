<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aşk Havayolları - Sanal Seyahat Simülasyonu</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .ticket-box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        h2 { color: #2d3436; margin-bottom: 5px; letter-spacing: 1px; }
        .subtitle { color: #b2bec3; font-size: 14px; margin-bottom: 25px; }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label { display: block; font-weight: 600; color: #636e72; margin-bottom: 8px; }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #dfe6e9;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 16px;
            outline: none;
        }

        .action-btn {
            background: #0984e3;
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .action-btn:hover { background: #74b9ff; transform: translateY(-2px); }

        .hidden { display: none !important; }

        .loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #2d3436;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 110;
            padding: 25px;
            text-align: center;
            box-sizing: border-box;
        }

        .plane-animation {
            font-size: 60px;
            animation: fly 2s infinite ease-in-out;
            margin-bottom: 20px;
        }

        @keyframes fly {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }

        #go-to-sim-btn {
            background: #00b894;
            margin-top: 25px;
            max-width: 280px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- GİRİŞ BİLETİ PANELİ -->
    <div id="ticket-container" class="ticket-box">
        <h2>AŞK HAVAYOLLARI VIRTUAL</h2>
        <p class="subtitle">Mesafe Tanımayan Macera Pasaportu</p>
        
        <div class="ticket-body">
            <div class="input-group">
                <label>Yolcu Adı:</label>
                <input type="text" id="passenger-name" placeholder="Sevgilinin Adı" value="Sedat">
            </div>
            
            <div class="input-group">
                <label>Rota Seçimi:</label>
                <select id="destination">
                    <option value="">-- Nereye Gitmek İstersin? --</option>
                    <option value="switzerland">İsviçre Alpleri (Kış Masalı)</option>
                    <option value="maldives">Maldivler Sahili (Sualtı Bungalovları)</option>
                    <option value="australia">Avustralya (Büyük Set Resifi)</option>
                </select>
            </div>
            
            <button class="action-btn" onclick="startSimulation()">Uçuş Kartını Onayla ✈ Pres</button>
        </div>
    </div>

    <!-- HİKAYE VE AKTİF BUTON EKRANI -->
    <div id="loading-screen" class="hidden">
        <div class="plane-animation">✈️</div>
        <h2 style="color: white;" id="loading-title">Uçuş Başlıyor...</h2>
        <p style="font-size: 18px; color: #dfe6e9; max-width: 500px; line-height: 1.6;" id="loading-text">Yolculuk hazırlanıyor...</p>
        
        <!-- Tarayıcı engelini aşan sihirli buton -->
        <button id="go-to-sim-btn" class="action-btn hidden" onclick="openSimulation()">Uçağa Bin ve Kemerini Bağla ✈️</button>
    </div>

    <script>
        let finalUrl = "";

        function startSimulation() {
            const name = document.getElementById('passenger-name').value;
            const dest = document.getElementById('destination').value;

            if (!name || !dest) {
                alert('Lütfen yolcu adını yazın ve uçmak istediğiniz rotayı seçin! ✈️');
                return;
            }

            document.getElementById('ticket-container').classList.add('hidden');
            document.getElementById('loading-screen').classList.remove('hidden');
            
            if (dest === "switzerland") {
                document.getElementById('loading-title').innerText = "🏔️ İsviçre Uçuşu";
                document.getElementById('loading-text').innerText = `Sayın Yolcumuz ${name}, Aşk Havayolları İsviçre semalarına ulaştı! Senin için karlı Alplerde harika bir dağ treni yolculuğu hazırladım. Telefonunu sağa sola çevirerek 360 derece etrafı izleyebilirsin. Hazırsan aşağıdaki butona tıklayarak uçağın kapısını aç!`;
                finalUrl = "https://youtube.com"; 
            } else if (dest === "maldives") {
                document.getElementById('loading-title').innerText = "🏝️ Maldivler Uçuşu";
                document.getElementById('loading-text').innerText = `Sayın Yolcumuz ${name}, şu an pırıl pırıl parlayan Maldivler adalarının üzerindeyiz! Seni masmavi sulara, okyanus altı otellerine ve bembeyaz sahillere indiriyorum. Hazırsan aşağıdaki yeşil butona bas ve adaya ilk adımını at!`;
                finalUrl = "https://youtube.com"; 
            } else if (dest === "australia") {
                document.getElementById('loading-title').innerText = "🦘 Avustralya Uçuşu";
                document.getElementById('loading-text').innerText = `Sayın Yolcumuz ${name}, devasa okyanusları aştık ve Avustralya semalarındayız! Seninle helikoptere binip Büyük Set Resifi'ni ve Sidney sokaklarını 360 derece gezeceğiz. Hazırsan butona bas ve macerayı başlat!`;
                finalUrl = "https://youtube.com"; 
            }

            // Kısa bir süre sonra yeşil buton parlayarak ekrana gelir, tarayıcı engeli kalkar
            setTimeout(() => {
                document.getElementById('go-to-sim-btn').classList.remove('hidden');
            }, 1500);
        }

        function openSimulation() {
            if(finalUrl !== "") {
                window.location.href = finalUrl; // Doğrudan kullanıcının tıklamasıyla tetiklendiği için ASLA engellenemez
            }
        }
    </script>
</body>
</html>
