<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aşk Havayolları - Sanal Seyahat Simülasyonu</title>
    
    <!-- Sitenin içinde 360 derece dönebilmek için gerekli sihirli kütüphane -->
    <link rel="stylesheet" href="https://jsdelivr.net"/>
    <script type="text/javascript" src="https://jsdelivr.net"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .ticket-box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 400px;
            width: 90%;
            z-index: 10;
        }

        h2 { color: #2d3436; margin-bottom: 5px; letter-spacing: 1px; }
        .subtitle { color: #b2bec3; font-size: 14px; margin-bottom: 25px; }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label { display: block; font-weight: 600; color: #636e72; margin-bottom: 8px; }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #dfe6e9;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 16px;
            outline: none;
        }

        .action-btn {
            background: #0984e3;
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .action-btn:hover { background: #74b9ff; transform: translateY(-2px); }

        .hidden { display: none !important; }

        /* SİNEMATİK SİMÜLATÖR EKRANI */
        #panorama-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            z-index: 100;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.7);
            color: #2d3436;
            border: none;
            padding: 12px 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            z-index: 110;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <!-- GİRİŞ BİLETİ PANELİ -->
    <div id="ticket-container" class="ticket-box">
        <h2>AŞK HAVAYOLLARI VIRTUAL</h2>
        <p class="subtitle">Mesafe Tanımayan Macera Pasaportu</p>
        
        <div class="ticket-body">
            <div class="input-group">
                <label>Yolcu Adı:</label>
                <input type="text" id="passenger-name" placeholder="Sevgilinin Adı" value="Sedat">
            </div>
            
            <div class="input-group">
                <label>Rota Seçimi:</label>
                <select id="destination">
                    <option value="">-- Nereye Gitmek İstersin? --</option>
                    <option value="switzerland">İsviçre Alpleri (Kış Masalı)</option>
                    <option value="maldives">Maldivler Sahili (Yaz Güneşi)</option>
                    <option value="australia">Avustralya (Sidney Şehir Turu)</option>
                </select>
            </div>
            
            <button class="action-btn" onclick="startSimulation()">Simülasyonu Kilitle ✈️</button>
        </div>
    </div>

    <!-- GERÇEK KODİÇİ 360 DERECE SİMÜLASYON ALANI (YÖNLENDİRME YOK!) -->
    <div id="panorama-container" class="hidden">
        <button class="back-btn" onclick="goBack()">✈️ Başka Ülkeye Uç</button>
        <div id="panorama" style="width: 100%; height: 100%;"></div>
    </div>

    <script>
        function startSimulation() {
            const name = document.getElementById('passenger-name').value;
            const dest = document.getElementById('destination').value;

            if (!name || !dest) {
                alert('Lütfen rotayı seçin! ✈️');
                return;
            }

            // Giriş ekranını kapat, simülasyonu aynı sitede aç
            document.getElementById('ticket-container').classList.add('hidden');
            document.getElementById('panorama-container').classList.remove('hidden');

            let imageUrl = "";
            let infoText = "";

            // İnternetteki engellenmeyen, doğrudan CDN üzerinden çekilen yüksek çözünürlüklü 360 derece gezi fotoğrafları
            if (dest === "switzerland") {
                imageUrl = "https://pannellum.org"; // Dağ ve doğa manzarası
                infoText = `Sedat için İsviçre Alpleri Simülasyonu`;
            } else if (dest === "maldives") {
                imageUrl = "https://pannellum.org"; // Alternatif stabil sahil panoraması
                // Eğer üstteki yüklenmezse pannellum resmi yedek:
                imageUrl = "https://pannellum.org"; // Muhteşem fiyort/sahil manzarası
                infoText = `Sedat için Maldivler Sahil Simülasyonu`;
            } else if (dest === "australia") {
                imageUrl = "https://pannellum.org"; // Canlı şehir/açık alan panoraması
                infoText = `Sedat için Avustralya Simülasyonu`;
            }

            // Pannellum 360 derece oynatıcısını sitenin içinde sıfırdan çalıştırıyoruz
            pannellum.viewer('panorama', {
                "type": "cubic",
                "cubeImages": [
                    "https://pannellum.org",
                    "https://pannellum.org",
                    "https://pannellum.org",
                    "https://pannellum.org",
                    "https://pannellum.org",
                    "https://pannellum.org"
                ],
                "title": infoText,
                "author": "Aşk Havayolları",
                "autoLoad": true,
                "autoRotate": -2
            });
        }

        function goBack() {
            document.getElementById('panorama-container').classList.add('hidden');
            document.getElementById('ticket-container').classList.remove('hidden');
        }
    </script>
</body>
</html>
