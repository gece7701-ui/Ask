<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aşk Havayolları - Sanal Seyahat Simülasyonu</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .ticket-box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        h2 { color: #2d3436; margin-bottom: 5px; letter-spacing: 1px; }
        .subtitle { color: #b2bec3; font-size: 14px; margin-bottom: 25px; }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label { display: block; font-weight: 600; color: #636e72; margin-bottom: 8px; }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #dfe6e9;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 16px;
            outline: none;
        }

        button {
            background: #0984e3;
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover { background: #74b9ff; transform: translateY(-2px); }

        .hidden { display: none !important; }

        .loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #2d3436;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 110;
            padding: 20px;
            text-align: center;
            box-sizing: border-box;
        }

        .plane-animation {
            font-size: 60px;
            animation: fly 2s infinite ease-in-out;
        }

        @keyframes fly {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }
    </style>
</head>
<body>

    <!-- GİRİŞ BİLETİ PANELİ -->
    <div id="ticket-container" class="ticket-box">
        <h2>AŞK HAVAYOLLARI VIRTUAL</h2>
        <p class="subtitle">Mesafe Tanımayan Macera Pasaportu</p>
        
        <div class="ticket-body">
            <div class="input-group">
                <label>Yolcu Adı:</label>
                <input type="text" id="passenger-name" placeholder="Sevgilinin Adı" value="Sedat">
            </div>
            
            <div class="input-group">
                <label>Rota Seçimi:</label>
                <select id="destination">
                    <option value="">-- Nereye Gitmek İstersin? --</option>
                    <option value="switzerland">İsviçre Alpleri (Kış Masalı)</option>
                    <option value="maldives">Maldivler Sahili (Sualtı Bungalovları)</option>
                    <option value="australia">Avustralya (Büyük Set Resifi)</option>
                </select>
            </div>
            
            <button id="fly-btn" onclick="startSimulation()">Simülasyonu Başlat ✈️</button>
        </div>
    </div>

    <!-- YÜKLEME VE TÜRKÇE MESAJ EKRANI -->
    <div id="loading-screen" class="hidden">
        <div class="plane-animation">✈️</div>
        <h2 style="color: white; margin-top: 20px;" id="loading-title">Uçuş Başlıyor...</h2>
        <p style="font-size: 18px; color: #dfe6e9; max-width: 500px;" id="loading-text">Yolculuk hazırlanıyor...</p>
    </div>

    <script>
        function startSimulation() {
            const name = document.getElementById('passenger-name').value;
            const dest = document.getElementById('destination').value;

            if (!name || !dest) {
                alert('Lütfen yolcu adını yazın ve uçmak istediğiniz rotayı seçin! ✈️');
                return;
            }

            document.getElementById('ticket-container').classList.add('hidden');
            document.getElementById('loading-screen').classList.remove('hidden');

            let simUrl = "";
            
            if (dest === "switzerland") {
                document.getElementById('loading-title').innerText = "🏔️ İsviçre Yolculuğu";
                document.getElementById('loading-text').innerText = `Sayın Kaptan ${name}, şu an karlı Alplerin üzerinden geçiyoruz. Sizin için harika bir dağ treni simülasyonu hazırladım. Telefonunu sağa sola çevirerek İsviçre doğasını 360 derece keşfetmeye hazır ol!`;
                simUrl = "https://youtube.com"; 
            } else if (dest === "maldives") {
                document.getElementById('loading-title').innerText = "🏝️ Maldivler Yolculuğu";
                document.getElementById('loading-text').innerText = `Sayın Kaptan ${name}, uçağımız masmavi Maldivler semalarında! Şimdi seni su altı otellerine ve bembeyaz kumsallara götürüyorum. Her şey tamamen Türkçe ve senin için özel seçildi. Keyfini çıkar!`;
                simUrl = "https://youtube.com"; 
            } else if (dest === "australia") {
                document.getElementById('loading-title').innerText = "🦘 Avustralya Yolculuğu";
                document.getElementById('loading-text').innerText = `Sayın Kaptan ${name}, okyanusu aştık ve Avustralya'dayız! Seninle Sidney limanında yürüyüşe çıkıp helikopterle doğayı gezeceğiz. Keşfetmek için sabırsızlanacaksın!`;
                simUrl = "https://youtube.com"; 
            }

            // 6 saniye boyunca Türkçe romantik yazıyı okut, sonra YouTube uygulamasına/safari sekmesine uçur
            setTimeout(() => {
                window.location.href = simUrl; 
            }, 6000);
        }
    </script>
</body>
</html>
