<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aşk Havayolları - Sanal Seyahat Simülasyonu</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .ticket-box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        h2 { color: #2d3436; margin-bottom: 5px; letter-spacing: 1px; }
        .subtitle { color: #b2bec3; font-size: 14px; margin-bottom: 25px; }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label { display: block; font-weight: 600; color: #636e72; margin-bottom: 8px; }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #dfe6e9;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 16px;
            outline: none;
        }

        button {
            background: #0984e3;
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover { background: #74b9ff; transform: translateY(-2px); }

        .hidden { display: none !important; }

        #simulation-container {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: black;
            z-index: 100;
        }

        iframe { width: 100%; height: 100%; border: none; }

        .loading-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #2d3436;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 110;
        }

        .plane-animation {
            font-size: 60px;
            animation: fly 2s infinite ease-in-out;
        }

        @keyframes fly {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }

        .back-btn {
            position: absolute;
            top: 20px; left: 20px;
            width: auto; padding: 10px 20px;
            background: rgba(255,255,255,0.6);
            color: #2d3436;
            font-weight: bold;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            z-index: 120;
        }
    </style>
</head>
<body>

    <!-- GİRİŞ BİLETİ PANELİ -->
    <div id="ticket-container" class="ticket-box">
        <h2>AŞK HAVAYOLLARI VIRTUAL</h2>
        <p class="subtitle">Mesafe Tanımayan Macera Pasaportu</p>
        
        <div class="ticket-body">
            <div class="input-group">
                <label>Yolcu Adı:</label>
                <input type="text" id="passenger-name" placeholder="Sevgilinin Adı" value="Sedat">
            </div>
            
            <div class="input-group">
                <label>Rota Seçimi:</label>
                <select id="destination">
                    <option value="">-- Nereye Gitmek İstersin? --</option>
                    <option value="switzerland">İsviçre Alpleri (Dağ Evi & Tren)</option>
                    <option value="maldives">Maldivler Sahili (Sualtı Odası)</option>
                    <option value="australia">Avustralya (Sidney Opera Binası)</option>
                </select>
            </div>
            
            <button id="fly-btn" onclick="startSimulation()">Simülasyonu Başlat ✈️</button>
        </div>
    </div>

    <!-- SİMÜLASYON EKRANI -->
    <div id="simulation-container" class="hidden">
        <div class="loading-screen" id="loading-screen">
            <div class="plane-animation">✈️</div>
            <p id="loading-text">Kaptan Pilotunuz Konuşuyor: Yolculuk Başlıyor...</p>
        </div>
        
        <!-- Kesinlikle iframe engeli yemeyen 360 derece YouTube VR linkleri entegre edildi -->
        <iframe id="sim-frame" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        <button class="back-btn" onclick="goBack()">Ana Menüye Dön</button>
    </div>

    <script>
        function startSimulation() {
            const name = document.getElementById('passenger-name').value;
            const dest = document.getElementById('destination').value;

            if (!name || !dest) {
                alert('Lütfen yolcu adını yazın ve uçmak istediğiniz rotayı seçin! ✈️');
                return;
            }

            document.getElementById('ticket-container').classList.add('hidden');
            document.getElementById('simulation-container').classList.remove('hidden');
            document.getElementById('loading-screen').classList.remove('hidden');

            document.getElementById('loading-text').innerText = `Kaptan Pilotunuz konuşuyor: Sayın ${name}, ${dest.toUpperCase()} yolculuğumuz başlıyor! Kemerleri bağlayın...`;

            // YouTube'un özel 360 derece VR simülasyon gömme linkleri (Iframe dostu)
            let simUrl = "";
            if (dest === "switzerland") {
                // İsviçre Alpleri Tren Yolculuğu 360 Derece Simülasyonu
                simUrl = "https://youtube.com"; 
            } else if (dest === "maldives") {
                // Maldivler Resort ve Sualtı Oteli 360 Derece Simülasyonu
                simUrl = "https://youtube.com"; 
            } else if (dest === "australia") {
                // Avustralya Sidney ve Doğa Turu 360 Derece Simülasyonu
                simUrl = "https://youtube.com"; 
            }

            setTimeout(() => {
                document.getElementById('sim-frame').src = simUrl;
                document.getElementById('loading-screen').classList.add('hidden');
            }, 4000);
        }

        function goBack() {
            document.getElementById('simulation-container').classList.add('hidden');
            document.getElementById('ticket-container').classList.remove('hidden');
            document.getElementById('sim-frame').src = "";
        }
    </script>
</body>
</html>
