<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aşkımızın Rotası 💖</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #2b0914 0%, #0d0408 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Şifre Ekranı (Login) */
    .login-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #140309;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }
    .login-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid #ff4d6d;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(255, 77, 109, 0.2);
      max-width: 350px;
      width: 90%;
    }
    .login-box h2 { color: #ff4d6d; margin-bottom: 10px; font-size: 1.5rem; }
    .login-box p { font-size: 0.9rem; color: #ffb3c1; margin-bottom: 20px; }
    .login-box input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ff4d6d;
      background: #2b0914;
      color: #fff;
      font-size: 1.2rem;
      text-align: center;
      outline: none;
      letter-spacing: 4px;
      margin-bottom: 15px;
    }
    .login-box button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #ff4d6d;
      color: #fff;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
    }
    .login-box button:hover { background: #ff758f; }
    .error-msg { color: #ff4d4d; font-size: 0.85rem; margin-top: 10px; display: none; }

    /* Ana Sayfa Başlıkları */
    h1 { margin-top: 10px; font-size: 2.2rem; text-align: center; color: #ff4d6d; text-shadow: 0 0 10px rgba(255,77,109,0.5); }
    p.subtitle { margin-bottom: 30px; color: #ffb3c1; font-size: 1rem; text-align: center; }

    /* Destinasyon Kartları */
    .map-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      max-width: 900px;
      width: 100%;
      margin-bottom: 30px;
    }
    .destination-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid #ff4d6d44;
      border-radius: 16px;
      padding: 20px;
      width: 200px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .destination-card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: #ff4d6d;
      box-shadow: 0 10px 25px rgba(255, 77, 109, 0.3);
      background: rgba(255, 77, 109, 0.1);
    }
    .destination-card span { font-size: 2.8rem; display: block; margin-bottom: 10px; }
    .destination-card h3 { color: #fff; font-size: 1.2rem; }

    /* Modal / Simülasyon Ekranı */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 3, 7, 0.9);
      backdrop-filter: blur(8px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .modal-content {
      background: #1f0710;
      border: 1px solid #ff4d6d;
      border-radius: 20px;
      max-width: 650px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      padding: 25px;
      box-shadow: 0 0 30px rgba(255, 77, 109, 0.4);
    }
